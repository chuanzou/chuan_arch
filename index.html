<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Chuan (Selina) Zou, Portfolio 2027: architecture and architectural conservation science.">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Chuan (Selina) Zou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Archivo+Narrow:wght@400;500&display=swap">
<style>
/* Layout: one screen, two closed books lying side by side on the same light-grey desk as the flip-books */
:root{
  --table:#E4E4E2; --table-edge:#D9D9D7; --ink:#2A2A29; --muted:#6E6E6B;
  --blue:#22417A;   /* portfolio cover */
  --teal:#1F4D4A;   /* lab notes cover */
  --book-shadow:rgba(30,30,30,.26);
  --f-page:"Newsreader","Times New Roman",Times,serif;
  --f-label:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 45%,var(--table) 60%,var(--table-edge) 100%);background-color:var(--table);color:var(--ink);
  font-family:var(--f-page);padding-inline:16px;padding-block:0 40px}
header{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:22px 6px}
header .nm{font-size:20px}
header .sub{font-family:var(--f-label);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
main{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,6vw,90px);padding-block:clamp(24px,6vh,64px) 0;align-items:start}
@media (max-width:640px){main{grid-template-columns:minmax(0,1fr);gap:48px}}
.book{display:grid;justify-items:center;gap:18px;text-decoration:none;color:inherit}
.cover{position:relative;width:min(100%,360px);aspect-ratio:8.5/11;transition:transform .35s cubic-bezier(.3,.7,.2,1),box-shadow .35s;
  box-shadow:0 2px 3px var(--book-shadow),0 22px 36px -14px var(--book-shadow);border-radius:1px 3px 3px 1px}
.cover img{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4%;z-index:2;
  background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.08) 55%,rgba(255,255,255,.08) 70%,rgba(0,0,0,0))}
.book:hover .cover,.book:focus-visible .cover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 4px 6px var(--book-shadow),0 34px 48px -16px var(--book-shadow)}
.book:focus-visible{outline:none}
.book:focus-visible .cover{outline:2px solid var(--ink);outline-offset:6px}
.meta{text-align:center;display:grid;gap:4px;max-width:360px}
.meta .k{font-family:var(--f-label);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.book.p .k{color:var(--blue)} .book.l .k{color:var(--teal)}
.meta h2{font-family:var(--f-page);font-weight:400;font-size:clamp(22px,2.6vw,28px);margin:0;text-wrap:balance}
.meta p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.meta .go{font-family:var(--f-label);font-size:13px;letter-spacing:.06em;margin-top:6px}
@media (prefers-reduced-motion:reduce){.cover{transition:none}}
</style>
</head>
<body>


<header><span class="nm">Chuan (Selina) Zou</span><span class="sub">Architecture and Architectural Conservation Science</span></header>
<main>
  <a class="book p" href="portfolio/">
    <span class="cover"><img src="portfolio/pages/p02.jpg" alt=""><img src="portfolio/pages/p00.svg" alt="Portfolio 2027, cover"></span>
    <span class="meta"><span class="k">Book I</span><h2>Portfolio 2027</h2><p>Academic projects and professional work, 2019–2026.</p><span class="go">Open the book →</span></span>
  </a>
  <a class="book l" href="lab/">
    <span class="cover"><img src="lab/pages/p02.jpg" alt=""><img src="lab/pages/p00.svg" alt="Laboratory Notes, cover"></span>
    <span class="meta"><span class="k">Book II</span><h2>Laboratory Notes</h2><p>Material analysis, finishes analysis and architectural pathology in the conservation lab.</p><span class="go">Open the book →</span></span>
  </a>
</main>

</body>
</html>
